name: Finalize Control Center assets

on:
  push:
    branches:
      - feat/control-center-v0.2
    paths:
      - '.bootstrap/app-js/**'
      - '.github/workflows/finalize-control-center.yml'

permissions:
  contents: write

concurrency:
  group: finalize-control-center-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: false
      - name: Assemble and verify embedded JavaScript
        run: |
          set -euo pipefail
          test -d .bootstrap/app-js
          cat .bootstrap/app-js/part*.js > internal/control/web/app.js
          printf '%s  %s\n' \
            'fd9c17e1599e2124b03c43cc48a8942568926f419dbe7418aaa9920365805fe0' \
            'internal/control/web/app.js' | sha256sum --check --strict
          rm -rf .bootstrap
          rm -f .github/workflows/finalize-control-center.yml
      - name: Verify source tree
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          node --check internal/control/web/app.js
          bash -n scripts/*.sh appliance/scripts/*.sh
      - name: Commit finalized source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize CherryWAF Control Center v0.2 assets'
          git push origin "HEAD:${GITHUB_REF_NAME}"
