name: Finalize ADC and per-application WAF v0.3

on:
  push:
    branches: [feat/adc-waf-parity-v0.3]

permissions:
  contents: write

concurrency:
  group: finalize-adc-v03-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: false
      - name: Extract and verify staged payload
        run: |
          set -euo pipefail
          test -d .bootstrap/adc-v03
          cat .bootstrap/adc-v03/chunk* > /tmp/adc-v03.tar.gz
          printf '%s  %s\n' \
            'a97b54e151c0ab0785c1ee871c5cf72e7452dda382e94788b5895eae5403c2c5' \
            '/tmp/adc-v03.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/adc-v03.tar.gz
          rm -rf .bootstrap
      - name: Apply repository integration patch
        run: |
          set -euo pipefail
          python3 tools/finalize_v03.py
      - name: Verify source tree
        run: |
          set -euo pipefail
          gofmt -w internal/config internal/reputation internal/bot internal/proxy internal/core internal/app
          make fmt
          go vet ./...
          go test -race ./...
          make webcheck
          make build
          CHERRYWAF_ADMIN_TOKEN=ci-only ./dist/cherrywaf validate-config --config ./configs/cherrywaf.adc.example.json
      - name: Commit finalized source
        run: |
          set -euo pipefail
          rm -f tools/finalize_v03.py
          # GitHub's workflow token cannot modify workflow files. Preserve the
          # branch copies here; the user-scoped connector updates/removes them
          # after the verified source commit has landed.
          git checkout HEAD -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize CherryWAF ADC and per-application WAF v0.3'
          git push origin HEAD:feat/adc-waf-parity-v0.3
