name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: false
      - name: Test
        run: go test ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            dir="release/cherrywaf-${VERSION}-linux-${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${build_date}" \
              -o "$dir/cherrywaf" ./cmd/cherrywaf
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w" -o "$dir/cherrywafctl" ./cmd/cherrywafctl
            cp -r configs deployments/systemd README.md SECURITY.md "$dir/"
            tar -C release -czf "release/cherrywaf-${VERSION}-linux-${arch}.tar.gz" \
              "cherrywaf-${VERSION}-linux-${arch}"
            rm -rf "$dir"
          done
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
